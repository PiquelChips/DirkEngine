[workspace]
resolver = "3"
members = ["Engine/Source/logging","Engine/Source/run"]

[workspace.dependencies]
# Basic stuff
log  = { version = "0.4", features = ["std"] }
time = { version = "0.3", features = ["formatting"] }

# Engine modules
logging = { path = "Engine/Source/logging" }

# Main Engine Dependencies
winit = "0.31.0-beta.2"
