[workspace]
resolver = "3"
members = [
    "Engine/Source/build",
    "Engine/Source/utils",
    "Engine/Source/engine",
    "Engine/Source/events",
    "Engine/Source/macros",
    "Engine/Source/logging",
    "Engine/Source/platform",
    "Engine/Source/run",
    "Engine/Source/resource_manager",
    "Engine/Source/utils",
    "Engine/Source/renderer",
    "Engine/Source/world",
    "Engine/Shaders"
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/PiquelChips/DirkEngine"
rust-version = "1.94.0"
version = "0.1.0"

[workspace.dependencies]
# Basic stuff
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-log = "0.2"
parking_lot = "0.12"

thiserror = "2"
anyhow = "1"
derive-getters = "0.5"

# Engine modules
build = { path = "Engine/Source/build" }
utils = { path = "Engine/Source/utils" }
logging = { path = "Engine/Source/logging" }
engine = { path = "Engine/Source/engine" }
events = { path = "Engine/Source/events" }
macros = { path = "Engine/Source/macros" }
platform = { path = "Engine/Source/platform" }
renderer = { path = "Engine/Source/renderer" }
resource_manager = { path = "Engine/Source/resource_manager" }
world = { path = "Engine/Source/world" }
shaders = { path = "Engine/Shaders" }

# Main Engine Dependencies
winit = "0.31.0-beta.2"
ash = { version = "0.38", features = ["loaded"] }
ash-window = "0.13"
raw-window-handle = "0.6"
glam = "0.32"
gltf = "1"
shaderc = "0.10"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }

# Macro dependencies
syn = "2.0"
quote = "1.0"
paste = "1"
