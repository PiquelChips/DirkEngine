[workspace]
resolver = "3"
members = [
    # Engine modules
    "Engine/Source/build",
    "Engine/Source/engine",
    "Engine/Source/logging",
    "Engine/Source/platform",
    "Engine/Source/run",

    # Shaders
    "Engine/Shaders/shaders",
    "Engine/Shaders/main"
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/PiquelChips/DirkEngine"
rust-version = "1.94.0"
version = "0.1.0"

[workspace.dependencies]
# Basic stuff
log  = { version = "0.4", features = ["std"] }
time = { version = "0.3", features = ["formatting"] }

thiserror = "2"
anyhow = "1"
# Engine modules
build = { path = "Engine/Source/build" }
logging = { path = "Engine/Source/logging" }
engine = { path = "Engine/Source/engine" }
platform = { path = "Engine/Source/platform" }

# Main Engine Dependencies
winit = "0.31.0-beta.2"
spirv-builder = { git = "https://github.com/Rust-GPU/rust-gpu.git", branch = "main" }
spirv-std = { git = "https://github.com/Rust-GPU/rust-gpu.git", branch = "main" }
